name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Verify release version
        env:
          TAG: ${{ github.ref_name }}
        run: python -c "import json,os; version=json.load(open('custom_components/talento_smart_ble/manifest.json'))['version']; assert os.environ['TAG']=='v'+version, 'Tag and manifest version must match'"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
